name: PEOPLE Banking CI Master

on:
  push:
    branches: 
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code from the repository
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Disable shallow clone to improve reporting

      # Spin up a MySQL database container
      - name: Spin Database Container
        run: docker run -d --rm -e MYSQL_ROOT_PASSWORD=root -p 3306:3306 mariadb:10.3 --lower_case_table_names=1
    
      # Set up JDK 17 (Temurin is the recommended distribution)
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'  # Ensure we're using the right distribution (Temurin)

      # Cache Maven dependencies to speed up builds
      - name: Cache Maven Dependencies
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
    
      # Build with Maven (Run tests here)
      - name: Build with Maven
        run: mvn clean verify
        env:
          GCP_MYSQL_DB_HOST: 0.0.0.0
          GCP_MYSQL_DB_PORT: 3306
          GCP_MYSQL_DB_UNAME: root
          GCP_MYSQL_DB_PASSWD: root

      # Extract branch name
      - name: Extract branch name
        shell: bash
        run: echo "##[set-output name=branch;]$(echo ${GITHUB_REF#refs/heads/} | tr / -)"
        id: extract_branch

      # Login to Docker Hub for pushing images
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t iscanprint/pbank:3.2 .

      # Push Docker image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push iscanprint/pbank:3.2

      # Logout from Docker Hub after pushing
      - name: Logout from Docker Hub
        run: docker logout
