name: PEOPLE Banking CI Master

on:
  push:
    branches: 
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout code from the repository
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0

      # Spin up a MySQL database container
      - name: Spin Database Container
        run: docker run -d --rm -e MYSQL_ROOT_PASSWORD=admin123 -p 3306:3306 mariadb:10.3 --lower_case_table_names=1

      # Wait for MySQL to be ready
      - name: Wait for MySQL to be ready
        run: |
          docker exec -i $(docker ps -q) /bin/bash -c "until mysqladmin ping --host=0.0.0.0 --password=admin123 --silent; do echo 'Waiting for MySQL...'; sleep 2; done;"

      # Grant privileges to the user
      - name: Grant MySQL Privileges
        run: |
          docker exec -i $(docker ps -q) mysql -u root -padmin123 -e "GRANT ALL PRIVILEGES ON *.* TO 'admin'@'%' IDENTIFIED BY 'admin123'; FLUSH PRIVILEGES;"

      # Set up JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          java-package: jdk
          architecture: x64
          distribution: 'adoptopen'  # Specify JDK distribution

      # Cache Maven dependencies to speed up the build
      - name: Cache Maven Dependencies
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Run Maven build (without running tests)
      - name: Run Maven Build
        run: mvn clean install -DskipTests=true

      # Run Maven build with verification (testing)
      - name: Build with Maven
        run: mvn clean verify
        env:
          GCP_MYSQL_DB_HOST: 0.0.0.0
          GCP_MYSQL_DB_PORT: 3306
          GCP_MYSQL_DB_UNAME: root
          GCP_MYSQL_DB_PASSWD: root

      # Login to Docker Hub for pushing images
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t iscanprint/pbank:3.1 .

      # Push Docker image to Docker Hub
      - name: Push Docker Image
        run: |
          docker push iscanprint/pbank:3.1

      # Logout from Docker Hub after pushing
      - name: Logout from Docker Hub
        run: docker logout
